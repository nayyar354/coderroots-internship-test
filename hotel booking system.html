<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
</head>
<style>
    body{
    margin-top: 10%;
    }
    h2{
        text-align: center;
        font-size: 30px;
        font-weight: bolder;
    }
    #loginSection{
    display: grid;
    place-content:center;
    }
    input[type="text"]{
        padding:10px 30px;
        border:none;
        background-color:bisque;
        border-radius: 20px;
    }
     input[type="text"]:hover{
        border:2px solid black;
     }
     button{
        padding:5px 10px;
     }
     h3{
        text-align: center;
     }


</style>
<body>
    <center>
      <h2>Hotel Booking System</h2>


<div id="loginSection">
    <input type="text" id="username" placeholder="Enter username"><br><br>
    <button id="loginBtn">Login</button>
</div>

<!-- Booking Section -->
<div id="bookingSection" style="display:none;">
<center>
    <h3>Book a Room</h3>

    <label style="text-align: center;">Booking Type:</label>
    <select id="bookingType">
        <option value="day">Per Day</option>
        <option value="hour">Per Hour</option>
    </select>

    <br><br>

    <label>Enter Days/Hours:</label>
    <input type="number" id="quantity" min="1" placeholder="Enter quantity">

    <h3>Total Amount: ₹<span id="total">0</span></h3>

    <button id="bookBtn">Book Now</button>
    <button id="logoutBtn">Logout</button>

    <h3>Booking History</h3>
    <div id="history"></div>
</center>
</div>
</center>
<script src="script.js"></script>
</body>
</html>
